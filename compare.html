<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Сравнение товаров — TechStore</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<script>
  function showJsError(msg) {
    var el = document.createElement("div");
    el.style.cssText = "background:rgba(50,0,0,0.9);color:#ff6060;padding:12px;margin:12px;border:1px solid #ff3030;border-radius:6px;font-family:monospace;font-size:0.85rem;";
    el.textContent = "⚠ Ошибка JS: " + msg;
    document.body.insertBefore(el, document.body.firstChild);
  }
  window.addEventListener("error", function(e){ showJsError(e.message); });
  window.addEventListener("unhandledrejection", function(e){ showJsError((e.reason&&e.reason.message)||String(e.reason)); });
  if (window.location.protocol==="file:") showJsError("Открыто как file://. Используйте локальный сервер.");
</script>

<header>
  <a class="logo" href="index.html">TechStore</a>
  <nav id="nav">
    <a href="index.html">Каталог</a>
    <a href="cart.html">Корзина</a>
  </nav>
</header>

<main>
  <a href="index.html" class="small-link">← Назад в каталог</a>
  <h1>Сравнение товаров</h1>

  <div id="compareContent">
    <div class="compare-empty" id="emptyMsg">
      <p style="font-size:1.1rem;">Нет товаров для сравнения.</p>
      <a href="index.html">← Добавьте товары из каталога</a>
    </div>
  </div>
</main>

<script type="module" src="js/compare.js"></script>
<script src="js/matrix.js"></script>
</body>
</html>
