<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Вход — TechStore</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<script>
  function showJsError(msg) {
    var el = document.createElement("div");
    el.style.cssText =
      "background:#fee2e2;color:#991b1b;padding:12px;margin:12px;border:1px solid #991b1b;border-radius:6px;font-family:monospace;font-size:0.85rem;white-space:pre-wrap;";
    el.textContent = "⚠ Ошибка JS: " + msg;
    document.body.insertBefore(el, document.body.firstChild);
  }
  window.addEventListener("error", function (e) {
    showJsError(e.message + (e.filename ? " (" + e.filename + ":" + e.lineno + ")" : ""));
  });
  window.addEventListener("unhandledrejection", function (e) {
    showJsError((e.reason && e.reason.message) || String(e.reason));
  });
  if (window.location.protocol === "file:") {
    showJsError(
      "Страница открыта напрямую как файл (file://). Модули JS не будут работать. Запустите локальный сервер — см. README."
    );
  }
</script>


<header>
  <a class="logo" href="index.html">TechStore</a>
  <nav>
    <a href="index.html">Каталог</a>
    <a href="register.html">Регистрация</a>
  </nav>
</header>

<main>
  <h1>Вход</h1>
  <div class="card">
    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" required />

      <label for="password">Пароль</label>
      <input type="password" id="password" required />

      <button type="submit">Войти</button>
      <p id="message"></p>
    </form>
    <p class="small-link">
      Забыли пароль? <a href="#" id="resetLink">Восстановить</a>
    </p>
    <p class="small-link">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
  </div>
</main>

<script type="module">
  import { loginUser, resetPassword, friendlyAuthError } from "./js/auth.js";

  const form = document.getElementById("loginForm");
  const message = document.getElementById("message");
  const resetLink = document.getElementById("resetLink");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    message.textContent = "";
    message.className = "";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
      await loginUser(email, password);
      message.textContent = "Вход выполнен! Переход в личный кабинет...";
      message.className = "success";
      setTimeout(() => (window.location.href = "profile.html"), 800);
    } catch (err) {
      message.textContent = friendlyAuthError(err);
      message.className = "error";
    }
  });

  resetLink.addEventListener("click", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    if (!email) {
      message.textContent = "Введите email в поле выше, затем нажмите «Восстановить»";
      message.className = "error";
      return;
    }
    try {
      await resetPassword(email);
      message.textContent = "Письмо для сброса пароля отправлено на " + email;
      message.className = "success";
    } catch (err) {
      message.textContent = friendlyAuthError(err);
      message.className = "error";
    }
  });
</script>

<script src="js/matrix.js"></script>
</body>
</html>
