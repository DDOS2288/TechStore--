<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Товар — TechStore</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<script>
  function showJsError(msg) {
    var el = document.createElement("div");
    el.style.cssText =
      "background:#fee2e2;color:#991b1b;padding:12px;margin:12px;border:1px solid #991b1b;border-radius:6px;font-family:monospace;font-size:0.85rem;white-space:pre-wrap;";
    el.textContent = "⚠ Ошибка JS: " + msg;
    document.body.insertBefore(el, document.body.firstChild);
  }
  window.addEventListener("error", function (e) {
    showJsError(e.message + (e.filename ? " (" + e.filename + ":" + e.lineno + ")" : ""));
  });
  window.addEventListener("unhandledrejection", function (e) {
    showJsError((e.reason && e.reason.message) || String(e.reason));
  });
  if (window.location.protocol === "file:") {
    showJsError(
      "Страница открыта напрямую как файл (file://). Модули JS не будут работать. Запустите локальный сервер — см. README."
    );
  }
</script>

<header>
  <a class="logo" href="index.html">TechStore</a>
  <nav id="nav">
    <a href="index.html">Каталог</a>
    <a href="cart.html">Корзина</a>
    <a href="profile.html">Личный кабинет</a>
  </nav>
</header>

<main>
  <a href="index.html" class="small-link">← Назад в каталог</a>

  <div id="loading" class="card">Загрузка...</div>
  <div id="notFound" class="card hidden">Товар не найден.</div>

  <div id="productBlock" class="hidden">
    <div class="card product-detail">
      <img id="productImage" src="" alt="" />
      <div>
        <h1 id="productName"></h1>
        <p id="productPrice" class="price"></p>
        <p id="productRating"></p>
        <p id="productDescription"></p>
        <button id="addToCartBtn">Добавить в корзину</button>
        <p id="cartMessage"></p>
      </div>
    </div>

    <div class="card">
      <h2>Характеристики</h2>
      <table id="specsTable"></table>
    </div>

    <div class="card" id="reviewsSection">
      <h2>Отзывы</h2>

      <div id="reviewsList"></div>
      <p id="reviewsEmpty" class="hidden">Отзывов пока нет. Будьте первым!</p>

      <div id="reviewFormBlock" class="hidden">
        <h3>Оставить отзыв</h3>
        <form id="reviewForm">
          <label>Оценка:</label>
          <div id="starPicker" style="font-size:1.8rem;cursor:pointer;margin-bottom:8px;letter-spacing:4px;">
            <span data-val="1">☆</span><span data-val="2">☆</span><span data-val="3">☆</span><span data-val="4">☆</span><span data-val="5">☆</span>
          </div>
          <input type="hidden" id="reviewRating" value="0" />
          <label for="reviewText">Комментарий:</label>
          <textarea id="reviewText" rows="3" placeholder="Ваш отзыв..." style="width:100%;box-sizing:border-box;padding:8px;margin-bottom:8px;font-size:0.95rem;"></textarea>
          <button type="submit">Отправить отзыв</button>
          <p id="reviewMsg"></p>
        </form>
      </div>
      <p id="reviewLoginMsg"><a href="login.html">Войдите</a>, чтобы оставить отзыв.</p>
    </div>

    <div class="card">
      <h2>Похожие товары</h2>
      <div id="relatedGrid" class="product-grid"></div>
    </div>
  </div>
</main>

<script type="module" src="js/product.js"></script>
<script src="js/matrix.js"></script>
</body>
</html>
